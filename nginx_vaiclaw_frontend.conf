server {
    listen 80;
    server_name app.vaimix.com;

    # Proxy /auth/* API calls directly to VaiClaw backend
    # This avoids CORS entirely and bypasses Next.js page routing
    location /auth/ {
        # Only proxy POST/PUT/DELETE (API calls) to backend
        # GET requests (page navigation) still go to Next.js
        if ($request_method = GET) {
            proxy_pass http://127.0.0.1:3002;
        }
        
        proxy_pass https://vaiclaw.vaimix.com/api/auth/;
        proxy_set_header Host vaiclaw.vaimix.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $http_content_type;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Hỗ trợ Websocket cho Next.js 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
